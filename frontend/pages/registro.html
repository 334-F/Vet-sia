<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="form-vetesia">
          <h2>Crear cuenta</h2>
          <p class="text-muted">Regístrate para empezar a comprar en VetÉsia.</p>
          <form id="form-registro">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombre *</label>
                <input type="text" id="nombre" class="form-control" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Apellidos *</label>
                <input type="text" id="apellidos" class="form-control" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email *</label>
              <input type="email" id="email" class="form-control" required autocomplete="email">
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Contraseña *</label>
                <input type="password" id="password" class="form-control" required minlength="8" autocomplete="new-password">
                <small class="text-muted">Mínimo 8 caracteres</small>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Repetir contraseña *</label>
                <input type="password" id="password2" class="form-control" required minlength="8" autocomplete="new-password">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="tel" id="telefono" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección de contacto (opcional)</label>
              <input type="text" id="direccion" class="form-control">
              <small class="text-muted">Más adelante podrás añadir direcciones de envío específicas.</small>
            </div>
            <div class="mb-3">
              <label class="form-label">Tipo de cuenta</label>
              <select id="tipo_cliente_id" class="form-select">
                <option value="1">Particular</option>
                <option value="2">Profesional (clínica o veterinaria)</option>
              </select>
            </div>
            <div class="form-check mb-3">
              <input type="checkbox" id="acepto" class="form-check-input" required>
              <label class="form-check-label" for="acepto">
                Acepto los términos y la política de privacidad
              </label>
            </div>
            <button type="submit" class="btn btn-vetesia w-100 btn-lg" id="btn-registro">Crear cuenta</button>
          </form>
          <hr>
          <p class="text-center mb-0">
            ¿Ya tienes cuenta? <a href="/pages/login.html">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (VETESIA.auth.isLoggedIn()) {
        window.location.href = '/';
        return;
      }

      document.getElementById('form-registro').addEventListener('submit', async e => {
        e.preventDefault();
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('password2').value;
        if (p1 !== p2) {
          VETESIA.ui.toast('Las contraseñas no coinciden', 'error');
          return;
        }
        const btn = document.getElementById('btn-registro');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-vetesia"></span> Creando cuenta…';
        try {
          await VETESIA.auth.register({
            nombre: document.getElementById('nombre').value.trim(),
            apellidos: document.getElementById('apellidos').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: p1,
            telefono: document.getElementById('telefono').value.trim() || null,
            direccion: document.getElementById('direccion').value.trim() || null,
            tipo_cliente_id: parseInt(document.getElementById('tipo_cliente_id').value, 10),
          });
          VETESIA.ui.toast('¡Cuenta creada! Bienvenido a VetÉsia.', 'success');
          setTimeout(() => window.location.href = '/', 1000);
        } catch (err) {
          VETESIA.ui.toast(err.message || 'Error al crear la cuenta', 'error');
          btn.disabled = false;
          btn.textContent = 'Crear cuenta';
        }
      });
    });
  </script>
</body>
</html>
