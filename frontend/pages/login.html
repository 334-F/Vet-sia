<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="form-vetesia">
          <h2>Iniciar sesión</h2>
          <p class="text-muted">Accede a tu cuenta de VetÉsia para gestionar tus pedidos.</p>
          <div id="alerta-expirada" class="alert alert-warning" style="display:none">
            Tu sesión ha caducado. Vuelve a iniciar sesión.
          </div>
          <form id="form-login">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required autocomplete="email">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-vetesia w-100 btn-lg" id="btn-login">Entrar</button>
          </form>
          <hr>
          <p class="text-center mb-0">
            ¿Aún no tienes cuenta? <a href="/pages/registro.html">Regístrate</a>
          </p>
        </div>

        <div class="alert alert-info mt-3 small">
          <strong>Usuarios de prueba:</strong><br>
          📧 admin@vetesia.com / admin123 (admin)<br>
          📧 maria@example.com / cliente123 (cliente)
        </div>
      </div>
    </div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (VETESIA.auth.isLoggedIn()) {
        window.location.href = '/';
        return;
      }
      if (VETESIA.ui.queryParam('expired')) {
        document.getElementById('alerta-expirada').style.display = 'block';
      }

      document.getElementById('form-login').addEventListener('submit', async e => {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-vetesia"></span> Entrando…';
        try {
          await VETESIA.auth.login(
            document.getElementById('email').value.trim(),
            document.getElementById('password').value
          );
          const next = VETESIA.ui.queryParam('next') || '/';
          window.location.href = next;
        } catch (err) {
          VETESIA.ui.toast(err.message || 'Credenciales incorrectas', 'error');
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      });
    });
  </script>
</body>
</html>
