<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-4">
    <h1 class="mb-4" style="color: var(--azul-verdoso-oscuro)">Mi carrito</h1>
    <div id="carrito-contenido"></div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', render);
    document.addEventListener('carrito:cambio', render);

    function render() {
      const carrito = VETESIA.cart.obtener();
      const cont = document.getElementById('carrito-contenido');

      if (carrito.length === 0) {
        cont.innerHTML = `
          <div class="text-center py-5">
            <p class="lead">Tu carrito está vacío.</p>
            <a href="/pages/catalogo.html" class="btn btn-vetesia btn-lg">Ir al catálogo</a>
          </div>
        `;
        return;
      }

      cont.innerHTML = `
        <div class="row">
          <div class="col-md-8">
            ${carrito.map((linea, i) => renderLinea(linea, i)).join('')}
          </div>
          <div class="col-md-4">
            ${renderResumen(carrito)}
          </div>
        </div>
      `;

      cont.querySelectorAll('[data-action="cantidad"]').forEach(input => {
        input.addEventListener('change', e => {
          VETESIA.cart.actualizarCantidad(
            parseInt(e.target.dataset.index, 10),
            parseInt(e.target.value, 10)
          );
        });
      });

      cont.querySelectorAll('[data-action="eliminar"]').forEach(btn => {
        btn.addEventListener('click', e => {
          VETESIA.cart.eliminar(parseInt(e.target.dataset.index, 10));
        });
      });
    }

    function renderLinea(linea, index) {
      const precioUnit = linea.precio_base + (linea.precio_extra_servicio || 0);
      const subtotal = precioUnit * linea.cantidad;
      return `
        <div class="carrito-linea">
          <img src="${linea.imagen_url || '/img/placeholder.png'}"
               onerror="this.src='/img/placeholder.png'"
               alt="${VETESIA.ui.escapeHtml(linea.nombre)}">
          <div class="info">
            <h6 class="mb-1">${VETESIA.ui.escapeHtml(linea.nombre)}</h6>
            ${linea.tipo_servicio_nombre ? `<small class="text-muted">Servicio: ${VETESIA.ui.escapeHtml(linea.tipo_servicio_nombre)}</small><br>` : ''}
            ${linea.personalizacion ? `<small class="text-muted">Personalización: "${VETESIA.ui.escapeHtml(linea.personalizacion)}"</small><br>` : ''}
            <small class="text-muted">${VETESIA.ui.precio(precioUnit)} / unidad</small>
          </div>
          <div class="text-center me-3">
            <label class="small d-block">Cantidad</label>
            <input type="number" class="form-control form-control-sm" style="width: 70px"
                   value="${linea.cantidad}" min="1"
                   data-action="cantidad" data-index="${index}">
          </div>
          <div class="text-end" style="min-width: 100px">
            <strong>${VETESIA.ui.precio(subtotal)}</strong>
            <br>
            <button class="btn btn-link btn-sm text-danger p-0"
                    data-action="eliminar" data-index="${index}">Eliminar</button>
          </div>
        </div>
      `;
    }

    function renderResumen(carrito) {
      const subtotal = VETESIA.cart.calcularSubtotal();
      return `
        <div class="carrito-resumen">
          <h5>Resumen</h5>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal:</span>
            <strong>${VETESIA.ui.precio(subtotal)}</strong>
          </div>
          <p class="small text-muted">El coste de envío se calculará en el siguiente paso según tu dirección.</p>
          <hr>
          <div class="d-flex justify-content-between total mb-3">
            <span>Total:</span>
            <span>${VETESIA.ui.precio(subtotal)}</span>
          </div>
          <a href="/pages/checkout.html" class="btn btn-verde btn-lg w-100">Finalizar compra →</a>
          <a href="/pages/catalogo.html" class="btn btn-link w-100 mt-2">Seguir comprando</a>
        </div>
      `;
    }
  </script>
</body>
</html>
