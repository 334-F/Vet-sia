<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido confirmado · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-4">
    <div id="contenido"></div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const pedidoId = VETESIA.ui.queryParam('id');
    document.addEventListener('DOMContentLoaded', async () => {
      if (!VETESIA.auth.requireAuth()) return;
      if (!pedidoId) { window.location.href = '/'; return; }

      try {
        const pedido = await VETESIA.api.get(`/pedidos/${pedidoId}`);
        document.getElementById('contenido').innerHTML = `
          <div class="text-center mb-5">
            <div style="font-size: 4rem">✅</div>
            <h1 style="color: var(--azul-verdoso-oscuro)">¡Pedido confirmado!</h1>
            <p class="lead">Tu pedido <strong>#VE-${String(pedido.id).padStart(6,'0')}</strong> ha sido registrado correctamente.</p>
            <p class="text-muted">Recibirás un email de confirmación con la factura adjunta en breve.</p>
          </div>

          <div class="row">
            <div class="col-md-8 offset-md-2">
              <div class="form-vetesia">
                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <strong>Estado:</strong> ${VETESIA.ui.estadoTag(pedido.estado)}
                  </div>
                  <div>
                    <strong>Fecha:</strong> ${VETESIA.ui.fechaHora(pedido.fecha)}
                  </div>
                </div>

                <h5>Resumen</h5>
                ${pedido.lineas.map(l => `
                  <div class="d-flex justify-content-between mb-1">
                    <span>${VETESIA.ui.escapeHtml(l.producto_nombre)} × ${l.cantidad}</span>
                    <span>${VETESIA.ui.precio(l.subtotal)}</span>
                  </div>
                `).join('')}
                <hr>
                <div class="d-flex justify-content-between mb-1">
                  <span>Subtotal:</span><span>${VETESIA.ui.precio(pedido.subtotal)}</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                  <span>Envío:</span><span>${VETESIA.ui.precio(pedido.coste_envio)}</span>
                </div>
                <div class="d-flex justify-content-between" style="font-size: 1.3rem; font-weight: bold">
                  <span>Total:</span>
                  <span style="color: var(--azul-verdoso-oscuro)">${VETESIA.ui.precio(pedido.total)}</span>
                </div>

                <div class="mt-4 text-center">
                  <button id="btn-factura" class="btn btn-vetesia">📄 Descargar factura PDF</button>
                  <a href="/pages/mis-pedidos.html" class="btn btn-outline-secondary">Ver mis pedidos</a>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('btn-factura').addEventListener('click', async () => {
          try {
            await VETESIA.api.descargarFactura(pedido.id);
          } catch (e) {
            VETESIA.ui.toast('No se pudo descargar la factura: ' + e.message, 'error');
          }
        });
      } catch (e) {
        document.getElementById('contenido').innerHTML =
          `<div class="alert alert-danger">${e.message}</div>`;
      }
    });
  </script>
</body>
</html>
