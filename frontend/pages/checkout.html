<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar compra · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-4">
    <h1 class="mb-4" style="color: var(--azul-verdoso-oscuro)">Finalizar compra</h1>
    <div id="checkout-contenido"></div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let direcciones = [];
    let metodosPago = [];
    let zonasEnvio = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!VETESIA.auth.requireAuth()) return;

      const carrito = VETESIA.cart.obtener();
      if (carrito.length === 0) {
        document.getElementById('checkout-contenido').innerHTML = `
          <div class="alert alert-warning">El carrito está vacío. <a href="/pages/catalogo.html">Ir al catálogo</a></div>
        `;
        return;
      }

      try {
        [direcciones, metodosPago, zonasEnvio] = await Promise.all([
          VETESIA.api.get('/direcciones'),
          VETESIA.api.get('/pedidos/metodos-pago'),
          VETESIA.api.get('/pedidos/zonas-envio'),
        ]);
        render(carrito);
      } catch (e) {
        document.getElementById('checkout-contenido').innerHTML =
          `<div class="alert alert-danger">${e.message}</div>`;
      }
    });

    function render(carrito) {
      const cont = document.getElementById('checkout-contenido');
      cont.innerHTML = `
        <div class="row">
          <div class="col-md-8">
            <div class="form-vetesia mb-4">
              <h4>1. Dirección de envío</h4>
              ${direcciones.length === 0 ? `
                <div class="alert alert-warning">
                  No tienes ninguna dirección guardada.
                  <a href="/pages/mis-direcciones.html?next=/pages/checkout.html">Añadir una ahora</a>
                </div>
              ` : `
                <div id="direcciones-lista">
                  ${direcciones.map(d => `
                    <div class="form-check mb-2 p-3 border rounded">
                      <input class="form-check-input" type="radio" name="direccion"
                             id="dir-${d.id}" value="${d.id}" ${d.predeterminada ? 'checked' : ''}>
                      <label class="form-check-label" for="dir-${d.id}">
                        <strong>${VETESIA.ui.escapeHtml(d.alias)}</strong> — ${VETESIA.ui.escapeHtml(d.destinatario)}
                        <br><span class="small text-muted">${VETESIA.ui.escapeHtml(d.calle)} ${d.numero || ''} ${d.piso || ''}, ${d.codigo_postal} ${d.municipio} (${d.provincia})</span>
                      </label>
                    </div>
                  `).join('')}
                </div>
                <a href="/pages/mis-direcciones.html?next=/pages/checkout.html" class="btn btn-link p-0">+ Añadir nueva dirección</a>
              `}
            </div>

            <div class="form-vetesia mb-4">
              <h4>2. Zona de envío</h4>
              <select id="zona-envio" class="form-select">
                ${zonasEnvio.map(z => `
                  <option value="${z.id}" data-coste="${z.coste_envio}">
                    ${VETESIA.ui.escapeHtml(z.nombre)} — ${VETESIA.ui.precio(z.coste_envio)} (${z.plazo_dias} días)
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="form-vetesia mb-4">
              <h4>3. Método de pago</h4>
              ${metodosPago.map(m => `
                <div class="form-check mb-2 p-3 border rounded">
                  <input class="form-check-input" type="radio" name="metodo-pago"
                         id="pago-${m.id}" value="${m.id}" data-pasarela="${m.requiere_pasarela}">
                  <label class="form-check-label" for="pago-${m.id}">
                    <strong>${VETESIA.ui.escapeHtml(m.nombre)}</strong>
                    ${m.descripcion ? '<br><span class="small text-muted">' + VETESIA.ui.escapeHtml(m.descripcion) + '</span>' : ''}
                  </label>
                </div>
              `).join('')}
              <div id="info-tarjeta" class="alert alert-info mt-2" style="display:none">
                💳 Para esta demo académica, usa la tarjeta de prueba: <code>4242 4242 4242 4242</code>, cualquier fecha futura y cualquier CVC.
              </div>
            </div>

            <div class="form-vetesia mb-4">
              <h4>4. Notas (opcional)</h4>
              <textarea id="notas" class="form-control" rows="2" placeholder="Indicaciones para el repartidor, horario preferido…"></textarea>
            </div>
          </div>

          <div class="col-md-4">
            <div class="carrito-resumen">
              <h5>Resumen del pedido</h5>
              ${carrito.map(l => {
                const precio = l.precio_base + (l.precio_extra_servicio || 0);
                return `
                  <div class="d-flex justify-content-between small mb-2">
                    <span>${VETESIA.ui.escapeHtml(l.nombre)} × ${l.cantidad}</span>
                    <span>${VETESIA.ui.precio(precio * l.cantidad)}</span>
                  </div>
                `;
              }).join('')}
              <hr>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal:</span>
                <span id="subtotal">${VETESIA.ui.precio(VETESIA.cart.calcularSubtotal())}</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span>Envío:</span>
                <span id="envio">${VETESIA.ui.precio(zonasEnvio[0].coste_envio)}</span>
              </div>
              <hr>
              <div class="d-flex justify-content-between total mb-3">
                <span>Total:</span>
                <span id="total">${VETESIA.ui.precio(VETESIA.cart.calcularSubtotal() + parseFloat(zonasEnvio[0].coste_envio))}</span>
              </div>
              <button id="btn-confirmar" class="btn btn-verde btn-lg w-100">
                ✓ Confirmar pedido
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('zona-envio').addEventListener('change', actualizarTotal);
      document.querySelectorAll('input[name="metodo-pago"]').forEach(r => {
        r.addEventListener('change', e => {
          document.getElementById('info-tarjeta').style.display =
            e.target.dataset.pasarela === 'true' ? 'block' : 'none';
        });
      });
      document.getElementById('btn-confirmar').addEventListener('click', confirmarPedido);
    }

    function actualizarTotal() {
      const sel = document.getElementById('zona-envio');
      const coste = parseFloat(sel.options[sel.selectedIndex].dataset.coste);
      const subtotal = VETESIA.cart.calcularSubtotal();
      document.getElementById('envio').textContent = VETESIA.ui.precio(coste);
      document.getElementById('total').textContent = VETESIA.ui.precio(subtotal + coste);
    }

    async function confirmarPedido() {
      const direccionEl = document.querySelector('input[name="direccion"]:checked');
      const metodoEl = document.querySelector('input[name="metodo-pago"]:checked');
      const zona = document.getElementById('zona-envio').value;

      if (!direccionEl) {
        VETESIA.ui.toast('Selecciona una dirección de envío', 'error');
        return;
      }
      if (!metodoEl) {
        VETESIA.ui.toast('Selecciona un método de pago', 'error');
        return;
      }

      const btn = document.getElementById('btn-confirmar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-vetesia"></span> Procesando…';

      try {
        const carrito = VETESIA.cart.obtener();
        const lineas = carrito.map(l => ({
          producto_id: l.producto_id,
          cantidad: l.cantidad,
          tipo_servicio_id: l.tipo_servicio_id || null,
          personalizacion: l.personalizacion || null,
        }));

        const resp = await VETESIA.api.post('/pedidos', {
          direccion_envio_id: parseInt(direccionEl.value, 10),
          metodo_pago_id: parseInt(metodoEl.value, 10),
          zona_envio_id: parseInt(zona, 10),
          notas: document.getElementById('notas').value || null,
          lineas,
        });

        VETESIA.cart.vaciar();
        VETESIA.ui.toast('¡Pedido creado correctamente!', 'success');
        setTimeout(() => {
          window.location.href = `/pages/pedido-confirmado.html?id=${resp.pedido.id}`;
        }, 1000);
      } catch (e) {
        VETESIA.ui.toast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Confirmar pedido';
      }
    }
  </script>
</body>
</html>
