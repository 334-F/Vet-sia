<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis pedidos · VetÉsia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-holder"></div>

  <div class="container my-4">
    <h1 class="mb-4" style="color: var(--azul-verdoso-oscuro)">Mis pedidos</h1>
    <div class="row">
      <div class="col-md-3 mb-3">
        <div class="list-group">
          <a href="/pages/mi-cuenta.html" class="list-group-item list-group-item-action">Datos personales</a>
          <a href="/pages/mis-pedidos.html" class="list-group-item list-group-item-action active">Mis pedidos</a>
          <a href="/pages/mis-direcciones.html" class="list-group-item list-group-item-action">Direcciones</a>
          <a href="#" class="list-group-item list-group-item-action text-danger" onclick="VETESIA.auth.logout(); return false;">Cerrar sesión</a>
        </div>
      </div>
      <div class="col-md-9">
        <div id="pedidos-lista"></div>
      </div>
    </div>
  </div>

  <div id="footer-holder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!VETESIA.auth.requireAuth()) return;

      const cont = document.getElementById('pedidos-lista');
      VETESIA.ui.cargando(cont);

      try {
        const pedidos = await VETESIA.api.get('/pedidos');
        if (pedidos.length === 0) {
          cont.innerHTML = `
            <div class="text-center py-5">
              <p class="lead">Aún no tienes pedidos.</p>
              <a href="/pages/catalogo.html" class="btn btn-vetesia">Ir al catálogo</a>
            </div>
          `;
          return;
        }
        cont.innerHTML = pedidos.map(p => `
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h5 class="mb-0">Pedido #VE-${String(p.id).padStart(6,'0')}</h5>
                  <small class="text-muted">${VETESIA.ui.fechaHora(p.fecha)}</small>
                </div>
                ${VETESIA.ui.estadoTag(p.estado)}
              </div>
              <div class="d-flex justify-content-between align-items-end">
                <div>
                  <strong>Total: ${VETESIA.ui.precio(p.total)}</strong>
                  <br><small class="text-muted">Pago: ${VETESIA.ui.escapeHtml(p.metodo_pago || '-')} · Zona: ${VETESIA.ui.escapeHtml(p.zona_envio || '-')}</small>
                </div>
                <div>
                  <button class="btn btn-sm btn-outline-secondary" onclick="descargarFactura(${p.id})">📄 Factura</button>
                  ${(p.estado === 'pendiente_pago' || p.estado === 'pagado' || p.estado === 'preparando') ? `
                    <button class="btn btn-sm btn-outline-danger" onclick="cancelarPedido(${p.id})">Cancelar</button>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        cont.innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    });

    async function descargarFactura(id) {
      try {
        await VETESIA.api.descargarFactura(id);
      } catch (e) {
        VETESIA.ui.toast(e.message, 'error');
      }
    }

    async function cancelarPedido(id) {
      if (!confirm('¿Seguro que quieres cancelar este pedido?')) return;
      try {
        await VETESIA.api.patch(`/pedidos/${id}/cancelar`);
        VETESIA.ui.toast('Pedido cancelado', 'success');
        setTimeout(() => location.reload(), 800);
      } catch (e) {
        VETESIA.ui.toast(e.message, 'error');
      }
    }
  </script>
</body>
</html>
